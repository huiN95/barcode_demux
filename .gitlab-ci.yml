default:
  tags:
    - shell-runner-38

stages:
  - build_temp_image
  - smoke_test
  - regression_test
  - nodiff_test
  - push_release
  - package
  - push_ali

variables:
  PROJECT_NAME: barcode_demux
  TEMP_TAG: tmp-$CI_COMMIT_SHORT_SHA

  BARCODE_SMOKE_TEST_DIR: /data/CI_CD_DATASETS/PROJECT_barcode/smoke_test

  RELEASE_TAG: $CI_COMMIT_TAG

  CI_REGISTRY_IMAGE: 192.168.3.38:5000/algo/barcode_demux
  ALI_ACR_REGISTRY_IMAGE: geneus-registry.cn-hongkong.cr.aliyuncs.com/algo/barcode_demux

  REFS_DIR: /data/CI_CD_DATASETS/REF_GENOMES

  # 上一次正式打包版本，用作 no-diff 基准
  STABLE_TAG: stable


# ===============================
# 1. 构建临时镜像
# main / branch / tag 都构建
# web 手动触发默认不跑
# ===============================

build_temp_image:
  stage: build_temp_image
  script:
    - echo `whoami`
    - echo "📦 Building temp image..."
    - DOCKER_BUILDKIT=1 docker build -t ${PROJECT_NAME}:${TEMP_TAG} .
    - docker images | grep ${PROJECT_NAME} || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - when: on_success


# ===============================
# 2. 冒烟测试
# 只测试当前临时镜像是否能正常跑
# ===============================

adapter_smoke_test:
  stage: smoke_test
  needs:
    - build_temp_image
  script:
    - echo `whoami`
    - echo "🔥 Smoke testing temp image..."
    - echo "冒烟测试文件目录：${BARCODE_SMOKE_TEST_DIR}"
    - bash -c 'source ~/.bashrc && python -u python_scripts/run_barcode_test.py --test-file-dir ${BARCODE_SMOKE_TEST_DIR} --docker-image ${PROJECT_NAME}:${TEMP_TAG} --test-type smoke'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - when: on_success


# ===============================
# 3. no-diff 测试
# 当前镜像 vs 上一次 stable 镜像
#
# 重点：
# - pipeline-version 1
# - output-format fastq
# - 比较两个输出目录下 FASTQ 是否完全一致
# ===============================

barcode_nodiff_test:
  stage: nodiff_test
  needs:
    - build_temp_image
    - adapter_smoke_test
  script:
    - echo `whoami`
    - echo "🔍 Running no-diff test..."
    - echo "Current image：${PROJECT_NAME}:${TEMP_TAG}"
    - echo "Stable image ：${CI_REGISTRY_IMAGE}:${STABLE_TAG}"

    # 确保 stable 镜像存在于本机
    - docker pull ${CI_REGISTRY_IMAGE}:${STABLE_TAG}

    # 运行 no-diff 测试
    - bash -c 'source ~/.bashrc && python -u python_scripts/run_barcode_test.py --test-file-dir ${BARCODE_SMOKE_TEST_DIR} --docker-image ${PROJECT_NAME}:${TEMP_TAG} --stable-image ${CI_REGISTRY_IMAGE}:${STABLE_TAG} --test-type no-diff'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - when: on_success


# ===============================
# 4. 预留 regression_test
# 如果暂时没有额外 regression，可以先不启用
# ===============================

# adapter_regression_test:
#   stage: regression_test
#   needs:
#     - build_temp_image
#     - adapter_smoke_test
#   script:
#     - echo "🧪 Running regression test..."
#     - bash -c 'source ~/.bashrc && python -u python_scripts/run_barcode_test.py --test-file-dir ${BARCODE_SMOKE_TEST_DIR} --docker-image ${PROJECT_NAME}:${TEMP_TAG} --stable-image ${CI_REGISTRY_IMAGE}:${STABLE_TAG} --test-type regression'
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "web"'
#       when: never
#     - when: on_success


# ===============================
# 5. tag 发版
# 只有 tag pipeline 才推送正式镜像
# ===============================

push_release:
  stage: push_release
  needs:
    - build_temp_image
    - adapter_smoke_test
    - barcode_nodiff_test
  script:
    - echo `whoami`
    - echo "📤 Pushing release image..."
    - echo "Release tag: ${RELEASE_TAG}"

    # 推送正式 release tag
    - docker tag ${PROJECT_NAME}:${TEMP_TAG} ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}
    - docker push ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}

    # 更新 stable，作为下一次 no-diff 的基准
    - docker tag ${PROJECT_NAME}:${TEMP_TAG} ${CI_REGISTRY_IMAGE}:${STABLE_TAG}
    - docker push ${CI_REGISTRY_IMAGE}:${STABLE_TAG}

    - echo "📤 Pushing release image DONE."
    - echo "Release image: ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}"
    - echo "Stable image : ${CI_REGISTRY_IMAGE}:${STABLE_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success


# ===============================
# 6. 打包 tar
# 只有 tag pipeline 才执行
# ===============================

package:
  stage: package
  needs:
    - push_release
  script:
    - echo "📦 Generating temporary package..."
    - docker pull ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}
    - docker save -o ${PROJECT_NAME}-${RELEASE_TAG}.tar ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}
    - mv ${PROJECT_NAME}-${RELEASE_TAG}.tar /dataLab/Geneus110/BC/共享文件夹/算法镜像/adacus
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success


# ===============================
# 7. 推送到阿里云 ACR
# 只有 tag pipeline 才执行
# ===============================

push_ali:
  stage: push_ali
  needs:
    - push_release
  script:
    - echo "📤 Pushing release image to ali"
    - docker pull ${CI_REGISTRY_IMAGE}:${RELEASE_TAG}
    - docker tag ${CI_REGISTRY_IMAGE}:${RELEASE_TAG} ${ALI_ACR_REGISTRY_IMAGE}:${RELEASE_TAG}
    - docker push ${ALI_ACR_REGISTRY_IMAGE}:${RELEASE_TAG}
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success