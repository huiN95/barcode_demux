default:
  tags:
    - shell-runner-38

stages:
  - build_temp_image
  - smoke_test
  - regression_test
  - nodiff_test
  - push_release
  - package

variables:
  PROJECT_NAME: barcode_demux
  TEMP_TAG: tmp-$CI_COMMIT_SHORT_SHA
  # primer_SMOKE_TEST_DIR: /data/CI_CD_DATASETS/PROJECT_primer/smoke_test
  # ASSIGN_BARCODE_TEST_DIR: /data/CI_CD_DATASETS/PROJECT_primer/assign_barcode_test
  RELEASE_TAG: $CI_COMMIT_TAG
  CI_REGISTRY_IMAGE: 192.168.3.38:5000/algo/barcode_demux
  GIT_SUBMODULE_STRATEGY: recursive


# ===============================
# 1. Push 到 main 分支流程
# ===============================


build_temp_image:
  stage: build_temp_image
  script:
    - echo `whoami`
    # - bash -c 'source ~/.bashrc && echo `python --version` '
    - echo "📦 Building temp image..."
    - DOCKER_BUILDKIT=0 docker build -t $PROJECT_NAME:$TEMP_TAG .
  except:
    - tags
    - web


push_release:
  stage: push_release
  script:
    - echo "📤 Pushing release image..."
    - docker tag $PROJECT_NAME:$TEMP_TAG $CI_REGISTRY_IMAGE:$RELEASE_TAG
    - docker push $CI_REGISTRY_IMAGE:$RELEASE_TAG
    - echo "📤 Pushing release image DONE. $CI_REGISTRY_IMAGE:$RELEASE_TAG"
  only:
    - tags

